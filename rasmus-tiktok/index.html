<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Everybody Loves Rasmus</title>
<style>
  :root {
    --red: #ff2340;
    --dkred: #c8102e;
    --yellow: #ffd60a;
    --white: #ffffff;
    --ink: #07070b;
    --muted: rgba(255,255,255,.62);
    --green: #22c55e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ink); }
  body { font-family: "Inter Display", "Inter", sans-serif; color: var(--white); }
  #stage { position: absolute; inset: 0; overflow: hidden; background: var(--ink); }
  #world { position: absolute; inset: 0; }
  .bg { position: absolute; inset: -200px; }
  #blobA, #blobB, #blobC { position: absolute; width: 1100px; height: 1100px; border-radius: 50%; opacity: .55; }
  #blobA { background: radial-gradient(circle, #ff2340 0%, rgba(255,35,64,0) 65%); }
  #blobB { background: radial-gradient(circle, #6d28d9 0%, rgba(109,40,217,0) 65%); opacity: .35; }
  #blobC { background: radial-gradient(circle, #ffd60a 0%, rgba(255,214,10,0) 65%); opacity: .12; }
  #grid { position: absolute; inset: -120px; opacity: .07;
    background-image: linear-gradient(rgba(255,255,255,.9) 2px, transparent 2px), linear-gradient(90deg, rgba(255,255,255,.9) 2px, transparent 2px);
    background-size: 120px 120px; }
  #grain { position: absolute; inset: 0; opacity: .09; mix-blend-mode: overlay; pointer-events: none; }
  #vignette { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 45%, rgba(0,0,0,.75) 100%); }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }

  /* TikTok crops ~95px per side on tall phones: keep all graphics inside a scaled safe area */
  #safe { position: absolute; inset: 0; transform: scale(.84); transform-origin: 540px 800px; }
  .scene { position: absolute; inset: 0; opacity: 0; transform-origin: 540px 760px; }
  .el { position: absolute; left: 540px; top: 0; transform: translate(-50%, -50%); white-space: nowrap; text-align: center; will-change: transform, opacity; }
  .black { font-weight: 900; letter-spacing: -0.03em; line-height: .9; text-transform: uppercase; }
  .xbold { font-weight: 800; letter-spacing: -0.01em; text-transform: uppercase; }
  .red { color: var(--red); }
  .yellow { color: var(--yellow); }
  .outline { color: transparent; -webkit-text-stroke: 5px var(--white); }
  .pill { padding: 18px 38px; border-radius: 999px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
  .stamp { padding: 18px 44px 22px; border-radius: 22px; font-weight: 900; text-transform: uppercase; letter-spacing: -.01em; line-height: .95; }
  .shadow { text-shadow: 0 18px 60px rgba(0,0,0,.55); }

  /* Captions */
  #captions { position: absolute; left: 130px; right: 130px; top: 1250px; height: 240px; display: flex; flex-wrap: wrap; justify-content: center; align-content: center; gap: 4px 22px; }
  #captions span { display: inline-block; font-weight: 900; font-size: 70px; text-transform: uppercase; letter-spacing: -0.01em; line-height: 1.05;
    text-shadow: 0 0 2px #000, 4px 4px 0 #000, -4px 4px 0 #000, 4px -4px 0 #000, -4px -4px 0 #000, 0 6px 0 #000, 0 10px 30px rgba(0,0,0,.8);
    transform-origin: 50% 70%; }

  /* Progress bar */
  #progress { position: absolute; left: 0; top: 0; height: 10px; background: linear-gradient(90deg, var(--red), var(--yellow)); }

  .viewfinder { position: absolute; inset: 0; opacity: 0; }
  .vf-c { position: absolute; width: 120px; height: 120px; border: 0 solid rgba(255,255,255,.9); }
</style>
</head>
<body>
<div id="stage">
  <div id="world">
    <div class="bg" id="bg"><div id="blobA"></div><div id="blobB"></div><div id="blobC"></div><div id="grid"></div></div>
    <div id="safe"><div id="scenes"></div></div>
    <div id="captions"></div>
  </div>
  <canvas id="grain" width="1080" height="1920"></canvas>
  <div id="vignette"></div>
  <div id="progress"></div>
  <div id="flash"></div>
</div>

<script>
// ---------- icons ----------
const ICON = {
  flag: (w) => `<svg width="${w}" height="${w*28/37}" viewBox="0 0 37 28"><rect width="37" height="28" rx="1.5" fill="#c8102e"/><rect x="12" width="4" height="28" fill="#fff"/><rect y="12" width="37" height="4" fill="#fff"/></svg>`,
  person: (s, c='#fff') => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><circle cx="12" cy="7" r="4.6" fill="${c}"/><path d="M3 23c0-5.4 4-9.2 9-9.2s9 3.8 9 9.2z" fill="${c}"/></svg>`,
  calendar: (s) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>`,
  tv: (w) => `<svg width="${w}" height="${w*0.86}" viewBox="0 0 100 86"><path d="M36 4l14 12 14-12" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/><rect x="4" y="16" width="92" height="62" rx="12" fill="#14141c" stroke="#fff" stroke-width="4"/><rect x="34" y="80" width="32" height="5" rx="2.5" fill="#fff"/></svg>`,
  heart: (s, c='#ff2340') => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path d="M12 21s-8.5-5.3-8.5-11.2A4.8 4.8 0 0 1 12 7a4.8 4.8 0 0 1 8.5 2.8C20.5 15.7 12 21 12 21z" fill="${c}"/></svg>`,
  bubble: (s, c='#fff') => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H10l-5 4v-4H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" fill="${c}"/></svg>`,
  comment: (s) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path d="M12 3C6.5 3 2 6.8 2 11.5c0 2.6 1.4 4.9 3.6 6.5L5 22l4.3-2.4c.9.2 1.8.3 2.7.3 5.5 0 10-3.8 10-8.4S17.5 3 12 3z" fill="#fff"/><circle cx="7.5" cy="11.5" r="1.6" fill="#07070b"/><circle cx="12" cy="11.5" r="1.6" fill="#07070b"/><circle cx="16.5" cy="11.5" r="1.6" fill="#07070b"/></svg>`,
  quote: (s, c='#ff2340') => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path d="M3 21v-7c0-5 2.5-8.3 7-9.5l1 2c-2.6 1-4 3-4.2 5.5H11V21zm10 0v-7c0-5 2.5-8.3 7-9.5l1 2c-2.6 1-4 3-4.2 5.5H21V21z" fill="${c}"/></svg>`,
  check: (s) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#fff"/><path d="M6.5 12.5l3.6 3.6 7.4-8" stroke="#16a34a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  cross: (s) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#fff"/><path d="M7.5 7.5l9 9M16.5 7.5l-9 9" stroke="#e11d48" stroke-width="3" stroke-linecap="round"/></svg>`,
  pin: (s) => `<svg width="${s}" height="${s}" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#1b1b24" stroke="#fff" stroke-width="5"/><circle cx="50" cy="50" r="27" fill="#0b0b10" stroke="#555" stroke-width="4"/><circle cx="50" cy="50" r="13" fill="#2a3a8a"/><circle cx="44" cy="44" r="5" fill="#cfd8ff" opacity=".8"/><circle id="pinRec" cx="78" cy="22" r="9" fill="#ff2340"/></svg>`,
  spark: (s, c='#ffd60a') => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path d="M12 0c.8 6.4 4.6 10.6 12 12-7.4 1.4-11.2 5.6-12 12-.8-6.4-4.6-10.6-12-12C7.4 10.6 11.2 6.4 12 0z" fill="${c}"/></svg>`,
  ghost: (s) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path d="M12 2a8 8 0 0 0-8 8v12l2.7-2 2.6 2 2.7-2 2.7 2 2.6-2L20 22V10a8 8 0 0 0-8-8z" fill="#fff"/><circle cx="9" cy="10" r="1.6" fill="#07070b"/><circle cx="15" cy="10" r="1.6" fill="#07070b"/></svg>`,
};

// ---------- math ----------
const clamp = (x, a=0, b=1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, p) => a + (b - a) * p;
const prog = (t, at, dur) => clamp((t - at) / dur);
const eOutBack = (x) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const eOutExpo = (x) => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const eOutCubic = (x) => 1 - Math.pow(1 - x, 3);
const eInOut = (x) => x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2;
const rnd = (n) => { const x = Math.sin(n * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); };

function tf(el, { x = 0, y = 0, s = 1, r = 0, o = 1, sx, sy, extra = '' } = {}) {
  el.style.transform = `translate(-50%,-50%) translate(${x}px,${y}px) rotate(${r}deg) scale(${sx ?? s},${sy ?? s}) ${extra}`;
  el.style.opacity = o;
}
// spring-in from small; returns visibility progress
function pop(el, t, at, { dur = .38, from = .3, dy = 50, r = 0, x = 0, out = Infinity } = {}) {
  if (t < at) { el.style.opacity = 0; return 0; }
  const p = prog(t, at, dur);
  const po = out < Infinity ? 1 - prog(t, out, .18) : 1;
  tf(el, { x, y: dy * (1 - eOutExpo(p)), s: lerp(from, 1, eOutBack(p)) * lerp(.85, 1, po), r, o: clamp(p * 4) * po });
  return p;
}
// slam down from huge
function slam(el, t, at, { dur = .26, from = 2.6, r = 0, x = 0, y = 0, out = Infinity } = {}) {
  if (t < at) { el.style.opacity = 0; return 0; }
  const p = prog(t, at, dur);
  const po = out < Infinity ? 1 - prog(t, out, .18) : 1;
  tf(el, { x, y, s: lerp(from, 1, eOutExpo(p)) * lerp(.85, 1, po), r: r * eOutExpo(p) + (1 - eOutExpo(p)) * r * 2.2, o: clamp(p * 6) * po });
  return p;
}

// ---------- timeline ----------
let TL, SC = {}, ORDER = [], PHRASES = [], SFX = [], SHAKES = [], FLASHES = [];
function word(id, pi, re) {
  const ph = SC[id].data.phrases[pi];
  const w = re ? ph.words.find(w => re.test(w.w)) : ph.words[0];
  return (w || ph.words[0]).s;
}
const P = (id, i) => SC[id].data.phrases[i];

function el(scene, html, y, cls = '', style = '') {
  const d = document.createElement('div');
  d.className = 'el ' + cls;
  d.style.top = y + 'px';
  if (style) d.style.cssText += style;
  d.innerHTML = html;
  scene.appendChild(d);
  return d;
}

// ---------- scenes ----------
const DEF = {};

DEF.hook = (S, $) => {
  const p = (i) => P('hook', i);
  $.imagine = el(S, 'Imagine this…', 760, 'xbold', 'font-size:110px;letter-spacing:.02em');
  $.day = el(S, 'DAY 001', 400, 'pill', 'font-size:44px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.25);font-variant-numeric:tabular-nums');
  $.four = el(S, '4', 720, 'black red shadow', 'font-size:640px');
  $.months = el(S, 'Months', 1060, 'black', 'font-size:180px');
  $.lies = el(S, 'of lies', 900, 'stamp', 'font-size:120px;background:var(--yellow);color:#000;left:760px');
  const tFour = p(1).s, tLies = word('hook', 3, /lying/);
  S.cfg = { slams: [[tFour, 1], [tLies, .8]], pops: [p(0).s, tFour + .18] };
  return (t) => {
    pop($.imagine, t, p(0).s, { out: tFour - .05 });
    slam($.four, t, tFour, { from: 3 });
    pop($.months, t, tFour + .18, { dy: 80 });
    if (pop($.day, t, tFour + .1, { dy: -30 })) {
      const d = Math.round(lerp(1, 120, eInOut(prog(t, tFour + .1, SC.hook.data.end - tFour - .3))));
      $.day.textContent = 'DAY ' + String(d).padStart(3, '0');
    }
    slam($.lies, t, tLies, { r: -8, from: 3 });
  };
};

DEF.noidea = (S, $) => {
  const s0 = SC.noidea.data.start;
  $.q = [];
  [[200, 470, -14, 220], [880, 560, 12, 180], [180, 1080, 8, 150], [900, 1120, -10, 240]].forEach(([x, y, r, f], i) => {
    const q = el(S, '?', y, 'black yellow', `font-size:${f}px;left:${x}px`); q.r = r; $.q.push(q);
  });
  $.no = el(S, 'No', 680, 'black', 'font-size:440px');
  $.idea = el(S, 'idea.', 960, 'black red', 'font-size:300px');
  const tIdea = word('noidea', 0, /idea/);
  S.cfg = { slams: [[s0 + .02, .8], [tIdea, .6]], glitch: [s0, tIdea] };
  return (t, f) => {
    slam($.no, t, s0 + .02, { from: 2.2 });
    slam($.idea, t, tIdea, { from: 2.2 });
    $.q.forEach((q, i) => {
      const at = s0 + .25 + i * .18;
      if (pop(q, t, at, { r: q.r })) q.style.transform += ` translateY(${Math.sin(t * 3 + i) * 14}px)`;
    });
    // RGB-split glitch in bursts
    const g = (Math.max(0, 1 - (t - s0) * 3) + Math.max(0, 1 - Math.abs(t - tIdea) * 4)) + (rnd(Math.floor(t * 12)) > .85 ? .6 : 0);
    const off = g * 18 * (rnd(f) - .5) * 2;
    [$.no, $.idea].forEach(e => {
      e.style.textShadow = g > .05 ? `${off}px 0 0 rgba(0,255,255,.85), ${-off}px 0 0 rgba(255,0,80,.85)` : 'none';
    });
  };
};

DEF.who = (S, $) => {
  const p = (i) => P('who', i), s0 = SC.who.data.start;
  $.flag = el(S, ICON.flag(330), 470, '', 'filter:drop-shadow(0 20px 40px rgba(0,0,0,.5))');
  $.label = el(S, 'Danish comedian', 655, 'pill', 'font-size:46px;background:var(--red)');
  $.first = el(S, 'Rasmus', 840, 'black shadow', 'font-size:250px');
  $.last = el(S, 'Wallbridge', 1050, 'black outline', 'font-size:158px');
  const tName = p(1).s;
  S.cfg = { slams: [[tName, .7]], pops: [s0, word('who', 0, /comedian/)] };
  return (t) => {
    if (pop($.flag, t, s0, { dy: -40 })) $.flag.style.transform += ` skewY(${Math.sin(t * 5) * 3}deg) rotate(${Math.sin(t * 2.5) * 2}deg)`;
    pop($.label, t, word('who', 0, /Danish/));
    slam($.first, t, tName, { from: 2.4 });
    const pl = prog(t, tName + .2, .45);
    if (t >= tName + .2) tf($.last, { x: lerp(-900, 0, eOutExpo(pl)), o: clamp(pl * 3) }); else $.last.style.opacity = 0;
  };
};

DEF.film = (S, $) => {
  const p = (i) => P('film', i), s0 = SC.film.data.start;
  // film strips at the edges
  const strip = (x) => {
    let holes = ''; for (let i = 0; i < 30; i++) holes += `<div style="width:34px;height:46px;border-radius:7px;background:var(--ink);margin:0 auto 30px"></div>`;
    return el(S, `<div style="width:84px;padding-top:20px;background:rgba(255,255,255,.12)">${holes}</div>`, 960, '', `left:${x}px`);
  };
  $.s1 = strip(46); $.s2 = strip(1034);
  $.clap = el(S, `<svg width="330" height="286" viewBox="0 0 120 104">
      <rect x="6" y="36" width="108" height="64" rx="8" fill="#14141c" stroke="#fff" stroke-width="4"/>
      <path d="M20 54h80M20 68h56M20 82h70" stroke="rgba(255,255,255,.35)" stroke-width="5" stroke-linecap="round"/>
      <g id="arm"><rect x="6" y="18" width="108" height="16" rx="4" fill="#fff"/>
      <path d="M22 18l12 16M46 18l12 16M70 18l12 16M94 18l12 16" stroke="#07070b" stroke-width="7"/></g></svg>`, 565);
  $.arm = $.clap.querySelector('#arm');
  // "living his dream" intro
  $.glow = el(S, '<div style="width:1000px;height:1000px;border-radius:50%;background:radial-gradient(circle,rgba(255,214,10,.35),rgba(255,214,10,0) 60%)"></div>', 760);
  $.living = el(S, 'He was living', 600, 'xbold', 'font-size:72px;letter-spacing:.04em;color:var(--muted)');
  $.dream = el(S, 'his dream', 770, 'black', 'font-size:176px;background:linear-gradient(180deg,#fff6c2 0%,#ffd60a 45%,#ff9f0a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 40px rgba(255,214,10,.45));padding:0 20px');
  $.sparks = [[150, 560, 90], [930, 600, 70], [220, 980, 60], [880, 960, 100], [540, 470, 50], [80, 800, 44], [1000, 790, 52]].map(([x, y, sz], i) => { const e = el(S, ICON.spark(sz), y, '', `left:${x}px`); e.i = i; return e; });
  $.movie = el(S, 'The movie', 830, 'black', 'font-size:170px');
  $.parody = el(S, `${ICON.ghost(54)}<span>Danish “Scary Movie”-style parody</span>`, 965, 'xbold', 'font-size:44px;display:flex;align-items:center;gap:16px;color:var(--yellow)');
  $.friend = el(S, `<div style="font-size:34px;letter-spacing:.2em;color:var(--muted);font-weight:700">WITH HIS FRIEND</div><div style="font-size:66px;margin-top:6px">MARTIN JOHANNES LARSEN</div>`, 1120, 'xbold',
    'padding:22px 44px;border-radius:28px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.2)');
  const tDream = word('film', 0, /living/), tMovie = p(1).s, tClap = tMovie + .42;
  S.cfg = { slams: [[tClap, .45]], clap: tClap, chime: tDream, pops: [s0 + .05, tMovie + .15, p(2).s, p(3).s] };
  return (t) => {
    // phase A: the dream (until "making his own movie")
    const m = eOutExpo(prog(t, tMovie, .45));           // 0 -> 1 as the dream shrinks into a header
    pop($.living, t, s0 + .05, { out: tMovie - .2 });
    if (t >= tDream) {
      const q = prog(t, tDream, .5);
      tf($.dream, { y: lerp(40 * (1 - eOutExpo(q)), -425, m), s: lerp(lerp(.5, 1, eOutBack(q)), .38, m), o: clamp(q * 3) });
    } else $.dream.style.opacity = 0;
    tf($.glow, { s: .9 + .08 * Math.sin(t * 2), o: prog(t, s0, .5) * (1 - m) });
    $.sparks.forEach(e => {
      const at = s0 + .1 + e.i * .08;
      if (t < at) { e.style.opacity = 0; return; }
      const tw = .55 + .45 * Math.sin(t * 6 + e.i * 1.7);
      tf(e, { s: eOutBack(prog(t, at, .4)) * tw, r: t * 40 + e.i * 20, y: Math.sin(t * 1.5 + e.i) * 12, o: (1 - m) * tw });
    });
    // phase B: the movie
    const ps = prog(t, tMovie, .3);
    [$.s1, $.s2].forEach((s, i) => tf(s, { y: ((t * 160 * (i ? -1 : 1)) % 152), o: .9 * ps }));
    pop($.clap, t, tMovie, { dy: 60 });
    const a = t < tClap ? lerp(-32, -28, prog(t, tMovie, .3)) : lerp(-28, 0, eOutExpo(prog(t, tClap - .08, .12)));
    $.arm.setAttribute('transform', `rotate(${t < tClap - .08 ? -30 : a} 8 34)`);
    pop($.movie, t, tMovie + .15);
    pop($.parody, t, p(2).s);
    pop($.friend, t, p(3).s, { dy: 60 });
  };
};

DEF.nofilm = (S, $) => {
  const p = (i) => P('nofilm', i), s0 = SC.nofilm.data.start;
  $.movie = el(S, `The dream<div class="strike" style="position:absolute;left:-30px;top:50%;height:30px;width:0;background:var(--red);transform:translateY(-50%) rotate(-4deg);border-radius:8px;box-shadow:0 0 30px var(--red)"></div>`, 560, 'black', 'font-size:170px');
  $.strike = $.movie.querySelector('.strike');
  $.fake = el(S, 'was fake', 730, 'stamp', 'font-size:110px;background:var(--red)');
  $.inon = el(S, `Martin was <span style="background:var(--yellow);color:#000;padding:0 18px;border-radius:12px">in on it</span>`, 900, 'black', 'font-size:84px');
  $.pin = el(S, ICON.pin(190), 1090);
  $.pinLabel = el(S, 'Lapel-pin hidden camera', 1222, 'xbold', 'font-size:38px;letter-spacing:.12em;color:var(--muted)');
  // viewfinder overlay
  const vf = document.createElement('div'); vf.className = 'viewfinder';
  const corner = (css) => `<div class="vf-c" style="${css}"></div>`;
  vf.innerHTML = corner('left:70px;top:330px;border-top-width:8px;border-left-width:8px') + corner('right:70px;top:330px;border-top-width:8px;border-right-width:8px')
    + corner('left:70px;top:1420px;border-bottom-width:8px;border-left-width:8px') + corner('right:70px;top:1420px;border-bottom-width:8px;border-right-width:8px')
    + `<div id="rec" style="position:absolute;left:110px;top:360px;font:800 40px Inter;letter-spacing:.1em;display:flex;gap:14px;align-items:center"><span style="width:26px;height:26px;border-radius:50%;background:var(--red)"></span>REC</div>`
    + `<div id="tc" style="position:absolute;right:110px;top:362px;font:700 38px Inter;font-variant-numeric:tabular-nums;color:var(--muted)">00:00:00</div>`;
  S.appendChild(vf); $.vf = vf; $.recDot = vf.querySelector('#rec span'); $.tc = vf.querySelector('#tc');
  $.pinRec = $.pin.querySelector('#pinRec');

    if (pop($.vs, t, p(2).s + .1, { from: 0, out })) $.vs.style.transform += ` rotate(${Math.sin(t * 6) * 6}deg)`;
    pop($.q1, t, tQ, { dy: 60 });
    slam($.q2, t, tQ + .1, { from: 2.4 });
    if (pop($.icon, t, tQ + .4, { from: 0 })) $.icon.style.transform += ` translateY(${-Math.abs(Math.sin((t - tQ) * 4.5)) * 40}px)`;
    if (pop($.cmt, t, tQ + .6)) $.cmt.style.transform += ` scale(${1 + .05 * Math.sin(t * 8)})`;
  };
};

// ---------- init / render ----------
let grainFrames = [];
window.init = (timeline) => {
  TL = timeline;
  const root = document.getElementById('scenes');
  TL.scenes.forEach((d, i) => { SC[d.id] = { data: d, i }; ORDER.push(d.id); d.phrases.forEach(ph => PHRASES.push({ ...ph, id: d.id })); });
  ORDER.forEach((id, i) => {
    const S = document.createElement('div'); S.className = 'scene'; root.appendChild(S);
    const $ = {};
    const upd = DEF[id](S, $);
    SC[id].el = S; SC[id].update = upd; SC[id].cfg = S.cfg || {};
    SC[id].next = i < ORDER.length - 1 ? TL.scenes[i + 1].start : TL.duration + 1;
    const c = SC[id].cfg;
    SFX.push({ t: Math.max(0, SC[id].data.start - .12), type: 'whoosh' });
    (c.slams || []).forEach(([at, a]) => { SHAKES.push([at, a]); SFX.push({ t: at, type: 'impact', a }); });
    (c.pops || []).forEach(at => SFX.push({ t: at, type: 'pop' }));
    (c.flash || []).forEach(at => FLASHES.push(at));
    if (c.boom) SFX.push({ t: c.boom, type: 'boom' });
    if (c.clap) SFX.push({ t: c.clap, type: 'clap' });
    if (c.chime) SFX.push({ t: c.chime, type: 'chime' });
    if (c.crackle) SFX.push({ t: c.crackle, type: 'crackle' });
    if (c.rec) SFX.push({ t: c.rec, type: 'rec' });
    if (c.glitch) c.glitch.forEach(at => SFX.push({ t: at, type: 'glitch' }));
    if (c.ticks) { const [a, b] = c.ticks; for (let k = 0; k < 22; k++) SFX.push({ t: a + (b - a) * (1 - Math.pow(1 - k / 21, 1 / 3)), type: 'tick' }); }
  });
  // grain frames
  const g = document.getElementById('grain'), ctx = g.getContext('2d');
  for (let k = 0; k < 6; k++) {
    const img = ctx.createImageData(540, 960);
    for (let i = 0; i < img.data.length; i += 4) { const v = Math.random() * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
    const c2 = document.createElement('canvas'); c2.width = 540; c2.height = 960; c2.getContext('2d').putImageData(img, 0, 0); grainFrames.push(c2);
  }
  return { sfx: SFX.sort((a, b) => a.t - b.t), duration: TL.duration };
};

let capKey = -1;
window.render = (t, f) => {
  // background drift
  const A = document.getElementById('blobA'), B = document.getElementById('blobB'), C = document.getElementById('blobC');
  A.style.transform = `translate(${-100 + Math.sin(t * .5) * 250}px, ${200 + Math.cos(t * .35) * 300}px)`;
  B.style.transform = `translate(${300 + Math.cos(t * .4) * 250}px, ${1000 + Math.sin(t * .3) * 260}px)`;
  C.style.transform = `translate(${500 + Math.sin(t * .27) * 200}px, ${500 + Math.cos(t * .45) * 300}px)`;
  document.getElementById('grid').style.transform = `translateY(${(t * 40) % 120}px)`;
  const gctx = document.getElementById('grain').getContext('2d');
  gctx.drawImage(grainFrames[f % grainFrames.length], 0, 0, 1080, 1920);

  // scenes
  let current = null;
  ORDER.forEach(id => {
    const s = SC[id], st = s.data.start;
    const on = t >= st - .001 && t < s.next;
    s.el.style.display = on ? 'block' : 'none';
    if (!on) return;
    current = s;
    const q = prog(t, st, .28);
    s.el.style.opacity = clamp(q * 5);
    s.el.style.transform = `scale(${lerp(1.14, 1, eOutExpo(q))})`;
    s.update(t, f);
  });

  // camera shake
  let sh = 0; SHAKES.forEach(([at, a]) => { if (t >= at) sh += a * Math.exp(-(t - at) * 11); });
  const w = document.getElementById('world');
  w.style.transform = `translate(${(rnd(f * 1.3) - .5) * 44 * sh}px, ${(rnd(f * 2.7 + 1) - .5) * 44 * sh}px) rotate(${(rnd(f * .7 + 5) - .5) * 2 * sh}deg)`;

  // flash
  let fl = 0; FLASHES.forEach(at => { if (t >= at) fl = Math.max(fl, Math.exp(-(t - at) * 7)); });
  document.getElementById('flash').style.opacity = fl * .9;

  // progress bar
  document.getElementById('progress').style.width = (t / TL.duration * 1080) + 'px';

  // captions
  const cap = document.getElementById('captions');
  let idx = -1; PHRASES.forEach((ph, i) => { if (t >= ph.s - .02) idx = i; });
  const hide = current && current.cfg.hideCaptions && t >= current.cfg.hideCaptions;
  if (idx < 0 || hide) { cap.style.opacity = 0; return; }
  cap.style.opacity = 1;
  const ph = PHRASES[idx];
  if (capKey !== idx) { capKey = idx; cap.innerHTML = ph.words.map(w => `<span>${w.w}</span>`).join(''); }
  [...cap.children].forEach((sp, i) => {
    const w = ph.words[i];
    if (t < w.s - .03) { sp.style.opacity = 0; return; }
    const q = prog(t, w.s - .03, .2);
    const active = t < w.e + .02 || i === ph.words.length - 1 && t < ph.e + .1;
    sp.style.opacity = 1;
    sp.style.color = active ? '#ffd60a' : '#ffffff';
    sp.style.transform = `translateY(${lerp(30, 0, eOutExpo(q))}px) scale(${lerp(.6, 1, eOutBack(q)) * (active ? 1.08 : 1)}) rotate(${active ? -1.5 : 0}deg)`;
  });
};
</script>
</body>
