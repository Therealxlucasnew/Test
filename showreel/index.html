<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"color-orange","type":"color","label":"Orange","default":"#FF5A1F"},
    {"id":"color-ink","type":"color","label":"Ink","default":"#141414"},
    {"id":"color-bone","type":"color","label":"Bone","default":"#EEE8DC"},
    {"id":"color-blue","type":"color","label":"Blue","default":"#2340FF"},
    {"id":"font-display","type":"string","label":"Display font","default":"Archivo Black"},
    {"id":"cta","type":"string","label":"Call to action","default":"Describe your video →"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/js/gsap.min.js"></script>
    <script src="assets/js/d3-array.min.js"></script>
    <script src="assets/js/d3-geo.min.js"></script>
    <script src="assets/js/land.js"></script>
    <style>
      :root {
        --color-orange: #ff5a1f;
        --color-ink: #141414;
        --color-bone: #eee8dc;
        --color-blue: #2340ff;
        --font-display: "Archivo Black";
        --font-body: "Montserrat";
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--color-orange);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
    </style>
  </head>
  <body>

      data-width="1920"
