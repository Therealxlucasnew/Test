<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: var(--color-ink);
    }
    .s9-tile {
      position: absolute;
      width: 640px;
      height: 540px;
      overflow: hidden;
    }
    .s9-center {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      line-height: 1;
      white-space: nowrap;
    }
    #s9-t0 { left: 0; top: 0; background: var(--color-orange); }
    #s9-t1 { left: 640px; top: 0; background: var(--color-bone); }
    #s9-t2 { left: 1280px; top: 0; background: var(--color-ink); }
    #s9-t3 { left: 0; top: 540px; background: var(--color-blue); perspective: 900px; }
    #s9-t4 { left: 640px; top: 540px; background: var(--color-ink); }
    #s9-t5 { left: 1280px; top: 540px; background: var(--color-bone); }
    #s9-aa { font-size: 300px; letter-spacing: -0.04em; color: var(--color-ink); }
    .s9-eq {
      position: absolute;
      bottom: 110px;
      width: 56px;
      height: 300px;
      background: var(--color-ink);
      transform-origin: 50% 100%;
    }
    #s9-3d { position: absolute; inset: 0; transform-style: preserve-3d; }
    .s9-3dl { font-size: 260px; letter-spacing: -0.03em; }
    .s9-gl { font-size: 124px; letter-spacing: -0.03em; color: var(--color-bone); }
    #s9-glr { color: #ff5a1f; mix-blend-mode: screen; }
    #s9-glb { color: #2340ff; mix-blend-mode: screen; }
    #s9-fill {
      position: absolute;
      inset: 0;
      background: var(--color-orange);
      opacity: 0;
    }
  </style>
  <div id="root" data-composition-id="s9" data-width="1920" data-height="1080">
    <div class="s9-tile" id="s9-t0"><div class="s9-center" id="s9-aa">Aa</div></div>
    <div class="s9-tile" id="s9-t1">
      <div class="s9-eq" id="s9-e0" style="left:110px"></div>
      <div class="s9-eq" id="s9-e1" style="left:180px"></div>
      <div class="s9-eq" id="s9-e2" style="left:250px"></div>
      <div class="s9-eq" id="s9-e3" style="left:320px;background:#FF5A1F"></div>
      <div class="s9-eq" id="s9-e4" style="left:390px"></div>
      <div class="s9-eq" id="s9-e5" style="left:460px"></div>
    </div>
    <div class="s9-tile" id="s9-t2">
      <svg width="640" height="540" viewBox="0 0 640 540">
        <circle cx="320" cy="270" r="210" fill="#202020" />
        <path id="s9-gland" fill="#EEE8DC" />
        <path id="s9-garc" fill="none" stroke="#FF5A1F" stroke-width="6" stroke-linecap="round" />
      </svg>
    </div>
    <div class="s9-tile" id="s9-t3"><div id="s9-3d"></div></div>
    <div class="s9-tile" id="s9-t4">
      <div data-layout-allow-overlap class="s9-center s9-gl" id="s9-glr">GLITCH</div>
      <div data-layout-allow-overlap class="s9-center s9-gl" id="s9-glb">GLITCH</div>
      <div data-layout-allow-overlap class="s9-center s9-gl" id="s9-gl0">GLITCH</div>
      <div data-layout-allow-overlap class="s9-center s9-gl" id="s9-gl1">GLITCH</div>
      <div data-layout-allow-overlap class="s9-center s9-gl" id="s9-gl2">GLITCH</div>
    </div>
    <div class="s9-tile" id="s9-t5">
      <svg width="640" height="540" viewBox="0 0 640 540">
        <path id="s9-wave" fill="none" stroke="#141414" stroke-width="14" stroke-linecap="round" />
      </svg>
    </div>
    <div id="s9-fill"></div>
  </div>
  <script>
    (function () {
      const $ = (id) => document.getElementById(id);
      // 3D tile layers
      const d3host = $("s9-3d");
      const layers3 = [];
      for (let i = 11; i >= 0; i--) {
        const d = document.createElement("div");
        d.className = "s9-center s9-3dl";
        d.setAttribute("data-layout-allow-overlap", "");
        d.textContent = "3D";
        d.style.color = i === 0 ? "#EEE8DC" : "rgb(" + (255 - i * 10) + "," + (90 - i * 4) + "," + (31 - i * 2) + ")";
        d3host.appendChild(d);
        gsap.set(d, { z: -i * 5 });
      }
      [0, 1, 2].forEach((i) => gsap.set("#s9-gl" + i, { clipPath: "inset(" + [205, 255, 300][i] + "px 0px " + (540 - [255, 300, 345][i]) + "px 0px)" }));

      const proj = d3.geoOrthographic().scale(210).translate([320, 270]).clipAngle(90);
      const gpath = d3.geoPath(proj);
      const ip = d3.geoInterpolate([139.7, 35.7], [-122.4, 37.8]);
      const glyphs = ["Aa", "Bb", "Gg", "Kk", "Qq", "Rr", "Ss", "Zz"];
      const hash = (n) => { let x = Math.sin(n * 127.1) * 43758.5453; return x - Math.floor(x); };

      const st = { t: 0 };
      function render() {
        const t = st.t;
        $("s9-aa").textContent = glyphs[Math.floor(t * 4) % glyphs.length];
        for (let i = 0; i < 6; i++) {
          const h = 0.25 + 0.75 * Math.abs(Math.sin(t * Math.PI * 2 + i * 0.9));
          gsap.set("#s9-e" + i, { scaleY: h });
        }
        proj.rotate([-(180 + t * 50), -25, 0]);
        $("s9-gland").setAttribute("d", gpath(window.SR_LAND) || "");
        const n = 40, c = [];
        const p = (t * 0.4) % 1;
        for (let i = 0; i <= n; i++) c.push(ip((i / n) * p));
        $("s9-garc").setAttribute("d", gpath({ type: "LineString", coordinates: c }) || "");
        gsap.set(d3host, { rotationY: Math.sin(t * 2.2) * 40, rotationX: Math.cos(t * 1.7) * 18 });
        const k = Math.floor(t * 15);
        for (let i = 0; i < 3; i++) gsap.set("#s9-gl" + i, { x: hash(k * 3 + i) < 0.5 ? (hash(k * 7 + i) - 0.5) * 120 : 0 });
        gsap.set("#s9-glr", { x: -6 - hash(k) * 18 });
        gsap.set("#s9-glb", { x: 6 + hash(k + 99) * 18 });
        let d = "";
        for (let i = 0; i <= 80; i++) {
          const u = i / 80, x = 70 + 500 * u;
          const y = 270 + Math.sin(u * Math.PI * 4 - t * 7) * 90 * Math.sin(Math.PI * u);
          d += (i ? " L " : "M ") + x.toFixed(1) + " " + y.toFixed(1);
        }
        $("s9-wave").setAttribute("d", d);
      }
      render();

      const tl = gsap.timeline({ paused: true });
      tl.fromTo(st, { t: 0 }, { t: 4.4, duration: 4.4, ease: "none", onUpdate: render }, 0);
      // Six tiles slam in, one every half beat.
      [0, 1, 2, 3, 4, 5].forEach((i) => {
        tl.fromTo("#s9-t" + i, { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.6)" }, 0.2 + i * 0.25);
      });
      // Collapse: the orange tile grows over the rest.
      tl.set("#s9-fill", { opacity: 1 }, 3.3);
      tl.fromTo("#s9-fill", { clipPath: "inset(0px 1280px 540px 0px)" }, { clipPath: "inset(0px 0px 0px 0px)", duration: 0.45, ease: "power3.in" }, 3.3);
      tl.set("#s9-t0", { opacity: 0 }, 3.3);
      window.__timelines["s9"] = tl;
    })();
  </script>
</template>
