<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: var(--color-orange);
    }
    #s1-stage {
      position: absolute;
      inset: 0;
    }
    .s1-word {
      position: absolute;
      left: 0;
      right: 0;
      top: 300px;
      height: 480px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: var(--font-display);
      font-size: 440px;
      line-height: 1;
      letter-spacing: -0.04em;
      color: var(--color-ink);
    }
    .s1-word span {
      display: inline-block;
      position: relative;
    }
    #s1-dot {
      position: absolute;
      left: 50%;
      top: 54%;
      width: 100px;
      height: 100px;
      margin: -50px 0 0 -50px;
      border-radius: 50%;
      background: var(--color-ink);
      opacity: 0;
    }
  </style>
  <div id="root" data-composition-id="s1" data-width="1920" data-height="1080">
    <div id="s1-stage">
      <div class="s1-word" id="s1-a">
        <span id="s1-a0">W</span><span id="s1-a1">O</span><span id="s1-a2">R</span><span id="s1-a3">D</span>
      </div>
      <div class="s1-word" id="s1-b">
        <span id="s1-b0">M</span><span id="s1-b1">O<i id="s1-dot"></i></span><span id="s1-b2">V</span><span id="s1-b3">E</span>
      </div>
    </div>
  </div>
  <script>
    (function () {
      function mulberry32(a) {
        return function () {
          a |= 0; a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const rnd = mulberry32(11);
      const tl = gsap.timeline({ paused: true });

      // WORD is on screen at frame 0. Punch on the spoken "word".
      tl.fromTo("#s1-a", { scale: 1 }, { scale: 1.06, duration: 0.08, ease: "power2.out" }, 0.82);
      tl.to("#s1-a", { scale: 1, duration: 0.35, ease: "expo.out" }, 0.9);

      // On "move": WORD scatters out, MOVE flies in from the opposite side.
      const outs = [];
      for (let i = 0; i < 4; i++) {
        const o = { x: (rnd() - 0.5) * 2400, y: (rnd() < 0.5 ? -1 : 1) * (500 + rnd() * 400), r: (rnd() - 0.5) * 140 };
        outs.push(o);
        tl.fromTo("#s1-a" + i, { x: 0, y: 0, rotation: 0, opacity: 1 },
          { x: o.x, y: o.y, rotation: o.r, duration: 0.32, ease: "power3.in" }, 1.86 + i * 0.033);
      }
      tl.set("#s1-a", { opacity: 0 }, 2.35);
      for (let i = 0; i < 4; i++) {
        const o = outs[3 - i];
        tl.fromTo("#s1-b" + i, { x: -o.x * 0.8, y: -o.y * 0.8, rotation: -o.r, opacity: 0 },
          { x: 0, y: 0, rotation: 0, opacity: 1, duration: 0.55, ease: "expo.out" }, 2.12 + i * 0.05);
      }
      tl.set("#s1-b0, #s1-b1, #s1-b2, #s1-b3", { opacity: 0 }, 0);

      // The O swells past the frame: its ink becomes the next world.
      tl.set("#s1-dot", { opacity: 1, scale: 0.2 }, 3.45);
      tl.fromTo("#s1-dot", { scale: 0.2 }, { scale: 48, duration: 0.6, ease: "power3.in" }, 3.45);
      tl.fromTo("#s1-b0, #s1-b2, #s1-b3", { scale: 1 }, { scale: 1.25, duration: 0.6, ease: "power3.in" }, 3.45);

      window.__timelines["s1"] = tl;
    })();
  </script>
