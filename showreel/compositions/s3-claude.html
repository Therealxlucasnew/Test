<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: var(--color-orange);
    }
    #s3-ground {
      position: absolute;
      inset: 0;
      background: var(--color-blue);
      opacity: 0;
    }
    #s3-name {
      position: absolute;
      left: 170px;
      top: 170px;
      font-family: var(--font-display);
      font-size: 250px;
      line-height: 1;
      letter-spacing: -0.04em;
      color: var(--color-ink);
      white-space: nowrap;
    }
    #s3-name span {
      display: inline-block;
    }
    #s3-svg {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
      overflow: visible;
    }
  </style>
  <div id="root" data-composition-id="s3" data-width="1920" data-height="1080">
    <div id="s3-ground"></div>
    <div id="s3-name"><span>I</span><span>'</span><span>m</span><span>&nbsp;</span><span>C</span><span>l</span><span>a</span><span>u</span><span>d</span><span>e</span></div>
    <svg id="s3-svg" viewBox="0 0 1920 1080">
      <path id="s3-wave" d="M 170 720 L 1750 720" fill="none" stroke="#141414" stroke-width="22" stroke-linecap="round" />
    </svg>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const wave = document.getElementById("s3-wave");
      const X0 = 170, X1 = 1750, Y = 720, N = 120;
      const st = { amp: 0, phase: 0, cycles: 2.2 };
      function draw() {
        let d = "";
        for (let i = 0; i <= N; i++) {
          const u = i / N;
          const x = X0 + (X1 - X0) * u;
          // ease the ends so the wave grows out of a fixed line
          const env = Math.sin(Math.PI * u);
          const y = Y + Math.sin(u * Math.PI * 2 * st.cycles - st.phase) * st.amp * env;
          d += (i ? " L " : "M ") + x.toFixed(1) + " " + y.toFixed(1);
        }
        wave.setAttribute("d", d);
      }
      draw();
      const len = 1600;

      // Name, letter by letter, slight blur.
      tl.fromTo("#s3-name span", { opacity: 0.0, filter: "blur(6px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.12, stagger: 0.04 }, 0.15);

      // "the line": a straight line draws across.
      tl.fromTo(wave, { strokeDasharray: len + 400, strokeDashoffset: len + 400 },
        { strokeDashoffset: 0, duration: 0.6, ease: "power3.out" }, 1.55);
      // "the motion": the line comes alive.
      tl.fromTo(st, { amp: 0 }, { amp: 150, duration: 0.7, ease: "expo.out", onUpdate: draw }, 2.6);
      tl.fromTo(st, { phase: 0 }, { phase: Math.PI * 7, duration: 1.4, ease: "none", onUpdate: draw }, 2.6);
      // Colour flood: the wave stays, the world turns blue and the wave settles to a bone baseline.
      tl.to(st, { amp: 0, duration: 0.4, ease: "power2.inOut", onUpdate: draw }, 3.55);
      tl.set("#s3-ground", { opacity: 1 }, 3.5);
      tl.fromTo("#s3-ground", { clipPath: "inset(720px 0px 360px 0px)" }, { clipPath: "inset(0px 0px 0px 0px)", duration: 0.42, ease: "power2.inOut" }, 3.5);
      tl.set(wave, { stroke: "#EEE8DC" }, 3.5);
      tl.to("#s3-name", { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power3.in" }, 3.5);
      window.__timelines["s3"] = tl;
    })();
  </script>
</template>
